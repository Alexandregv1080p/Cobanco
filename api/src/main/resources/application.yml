spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banco}
    username: ${DB_USER:banco}
    password: ${DB_PASSWORD:banco}
  jpa:
    hibernate:
      ddl-auto: validate   # o schema e dono do Flyway; o JPA so valida
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

# Integracao com o nucleo COBOL
cobol:
  bin-dir: ${COBOL_BIN_DIR:/usr/local/bin}
  # subprocess = spawn por chamada | ffi = lib compartilhada in-process (transacoes)
  mode: ${COBOL_MODE:subprocess}

server:
  port: 8080
