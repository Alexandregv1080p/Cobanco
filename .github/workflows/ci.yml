name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  api:
    name: Testes da API (Java + COBOL + Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar GnuCOBOL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnucobol

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers usa o Docker ja disponivel no runner; o cobc compila o nucleo COBOL.
      - name: mvn test
        working-directory: api
        run: mvn -B test

  web:
    name: Build do front (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci + build
        working-directory: web
        run: |
          npm ci
          npm run build
